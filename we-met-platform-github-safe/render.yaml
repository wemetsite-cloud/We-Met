services:
  - type: web
    name: we-met-platform
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: commit
    rootDir: we-met-platform-github-safe
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: APP_NAME
        value: "We Met"
      - key: SUPPORT_EMAIL
        value: "wemetsite@gmail.com"
      - key: SERVE_FRONTENDS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: "Sabith Salah Kp"
      - key: ADMIN_USERNAME
        value: "sabithkp"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_EMPLOYEE_NAME
        value: "Salah"
      - key: DEMO_EMPLOYEE_EMAIL
        value: "gentle8x@gmail.com"
      - key: DEMO_EMPLOYEE_PASSWORD
        sync: false
      - key: DEMO_EMPLOYEE_CODE
        value: "WM-L001"
      - key: RESET_SEEDED_PASSWORDS
        value: "false"
      - key: RING_SECONDS
        value: "30"
      - key: MINIMUM_START_SECONDS
        value: "120"
      - key: LOW_BALANCE_SECONDS
        value: "60"
      - key: MEDIA_RECONNECT_SECONDS
        value: "45"
      - key: MAX_CALL_SECONDS
        value: "0"
      - key: STUN_URL
        value: "stun:stun.l.google.com:19302"
      - key: PAYMENT_GATEWAY_MODE
        value: "disabled"
