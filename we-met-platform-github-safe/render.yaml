services:
  - type: web
    name: we-met-platform
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run start:production
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: APP_NAME
        value: "We Met"
      - key: SUPPORT_EMAIL
        value: "wemetsite@gmail.com"
      - key: PUBLIC_URL
        value: "https://wemet.xyz"
      - key: ALLOWED_ORIGINS
        value: "https://wemet.xyz,https://www.wemet.xyz,https://admin.wemet.xyz,https://listener.wemet.xyz"
      - key: SERVE_FRONTENDS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: "Sabith Salah Kp"
      - key: ADMIN_USERNAME
        value: "sabithkp"
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_SUBSCRIPTION_PLAN_ID
        value: "plan_TTIsGpwDtJmgi5"
      - key: RAZORPAY_SUBSCRIPTION_AMOUNT_PAISE
        value: "39900"
      - key: RAZORPAY_SUBSCRIPTION_TOTAL_COUNT
        value: "120"
      - key: LISTENER_SUBSCRIPTION_CREDIT_PAISE
        value: "5000"
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMS_ENABLED
        value: "false"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_OTP_TEMPLATE_ID
        sync: false
      - key: SMS_OTP_EXPIRY_MINUTES
        value: "10"
      - key: INITIAL_LISTENER_NAME
        value: "First Listener"
      - key: INITIAL_LISTENER_USERNAME
        value: "first.listener"
      - key: INITIAL_LISTENER_PHONE
        sync: false
      - key: INITIAL_LISTENER_PASSWORD
        sync: false
      - key: INITIAL_LISTENER_CODE
        value: "WM-L001"
      - key: RESET_SEEDED_PASSWORDS
        value: "false"
      - key: RING_SECONDS
        value: "30"
      - key: MINIMUM_START_SECONDS
        value: "120"
      - key: LOW_BALANCE_SECONDS
        value: "60"
      - key: MEDIA_RECONNECT_SECONDS
        value: "45"
      - key: LISTENER_DISCONNECT_GRACE_SECONDS
        value: "45"
      - key: MAX_CALL_SECONDS
        value: "0"
      - key: STUN_URL
        value: "stun:stun.l.google.com:19302"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:wemetsite@gmail.com"
