services:
  - type: web
    name: we-met-platform
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run start:production
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: APP_NAME
        value: "We Met"
      - key: SUPPORT_EMAIL
        value: "wemetsite@gmail.com"
      - key: PUBLIC_URL
        value: "https://wemet.xyz"
      - key: ALLOWED_ORIGINS
        value: "https://wemet.xyz,https://www.wemet.xyz,https://admin.wemet.xyz,https://listener.wemet.xyz"
      - key: SERVE_FRONTENDS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: "Sabith Salah Kp"
      - key: ADMIN_USERNAME
        value: "sabithkp"
      - key: ADMIN_PASSWORD
        sync: false
      - key: INITIAL_LISTENER_NAME
        value: "First Listener"
      - key: INITIAL_LISTENER_EMAIL
        sync: false
      - key: INITIAL_LISTENER_PASSWORD
        sync: false
      - key: INITIAL_LISTENER_CODE
        value: "WM-L001"
      - key: RESET_SEEDED_PASSWORDS
        value: "false"
      - key: RING_SECONDS
        value: "30"
      - key: MINIMUM_START_SECONDS
        value: "120"
      - key: LOW_BALANCE_SECONDS
        value: "60"
      - key: MEDIA_RECONNECT_SECONDS
        value: "45"
      - key: LISTENER_DISCONNECT_GRACE_SECONDS
        value: "45"
      - key: MAX_CALL_SECONDS
        value: "0"
      - key: STUN_URL
        value: "stun:stun.l.google.com:19302"
      - key: UPI_PAYMENT_PAYEE_NAME
        sync: false
      - key: UPI_PAYMENT_ID
        sync: false
      - key: UPI_PAYMENT_INTENT_MINUTES
        value: "1440"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:wemetsite@gmail.com"
